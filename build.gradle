// ./gradlew clean
// ./gradlew build -x test
// ./gradlew --version

// all versions below are updated at 2026-10-16.
plugins {
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

group = 'org.hkpc.dtd'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
//    testImplementation 'org.springframework.security:spring-security-test'

    implementation 'org.postgresql:postgresql:42.7.10'
    implementation 'com.alibaba:druid-spring-boot-4-starter:1.2.28'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.1.0'
    implementation 'com.github.pagehelper:pagehelper-spring-boot-starter:4.1.1'
    implementation 'org.mybatis.generator:mybatis-generator-core:1.4.2'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

    implementation 'org.aspectj:aspectjweaver:1.9.25.1'

    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    implementation 'com.alibaba.fastjson2:fastjson2:2.0.65'

    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    // Potential error (jjwt-impl classes not found) during local run. Reason: IDE run configurations often omit runtimeOnly jars
    // Quick fix (but not best practice): change runtimeOnly to implementation
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    implementation 'com.fasterxml.uuid:java-uuid-generator:5.2.0'

    implementation 'org.apache.poi:poi:5.5.1'
    implementation 'org.apache.poi:poi-ooxml:5.5.1'
}

bootRun {
  systemProperty 'spring.profiles.active', findProperty('spring.profiles.active') ?: 'dev'
}

def placeTasksInOrder(List tasks) {
    for (int i=0; i < tasks.size() -1; i++) {
        def earlierTask = tasks.get(i)
        def laterTask   = tasks.get(i +1)
        laterTask.mustRunAfter(earlierTask)
    }
}

task buildWithTest {
    def containedTasks = [clean, build]
    dependsOn containedTasks
    placeTasksInOrder(containedTasks)
}

//reason: https://github.com/spring-projects/spring-framework/wiki/Upgrading-to-Spring-Framework-6.x#parameter-name-retention:
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add("-parameters")
}
tasks.withType(GroovyCompile).configureEach {
    groovyOptions.parameters = true
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
